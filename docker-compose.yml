version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codesklii-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codesklii
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codesklii-network

  mongodb:
    image: mongo:6.0
    container_name: codesklii-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - codesklii-network

  redis:
    image: redis:7-alpine
    container_name: codesklii-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - codesklii-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesklii-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/codesklii?schema=public"
      MONGODB_URI: "mongodb://mongodb:27017/codesklii"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "codesklii_super_secret_jwt_key_prod"
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - codesklii-network

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: codesklii-frontend
    restart: always
    networks:
      - codesklii-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: codesklii-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - codesklii-network

networks:
  codesklii-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

